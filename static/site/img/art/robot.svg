<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380" role="img" aria-label="Robotul K-BOT">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcebfb"/>
    </linearGradient>
    <linearGradient id="chest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4db0ff"/>
      <stop offset="1" stop-color="#0a5cb8"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#d9fbff"/>
      <stop offset="1" stop-color="#39d0ff"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="160" cy="352" rx="96" ry="14" fill="#0b4f9c" opacity="0.14"/>
  <!-- antenna -->
  <line x1="160" y1="44" x2="160" y2="70" stroke="#a9c9ee" stroke-width="6" stroke-linecap="round"/>
  <circle cx="160" cy="36" r="10" fill="#39d0ff" filter="url(#glow)"/>
  <!-- ears -->
  <circle cx="70" cy="132" r="18" fill="url(#chest)"/>
  <circle cx="250" cy="132" r="18" fill="url(#chest)"/>
  <!-- head -->
  <rect x="78" y="68" width="164" height="130" rx="54" fill="url(#shell)" stroke="#bcd7f3" stroke-width="3"/>
  <rect x="96" y="86" width="128" height="94" rx="38" fill="#0b2a5b"/>
  <ellipse cx="134" cy="128" rx="13" ry="18" fill="url(#eye)" filter="url(#glow)"/>
  <ellipse cx="186" cy="128" rx="13" ry="18" fill="url(#eye)" filter="url(#glow)"/>
  <path d="M142 156 Q160 170 178 156" fill="none" stroke="#39d0ff" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- body -->
  <path d="M104 212 Q104 204 114 204 L206 204 Q216 204 216 212 L220 320 Q220 338 202 338 L118 338 Q100 338 100 320 Z" fill="url(#shell)" stroke="#bcd7f3" stroke-width="3"/>
  <circle cx="160" cy="260" r="30" fill="url(#chest)"/>
  <text x="160" y="272" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff">K</text>
  <!-- left arm -->
  <path d="M104 226 Q78 240 76 280" fill="none" stroke="#bcd7f3" stroke-width="22" stroke-linecap="round"/>
  <path d="M104 226 Q78 240 76 280" fill="none" stroke="url(#shell)" stroke-width="16" stroke-linecap="round"/>
  <!-- waving arm -->
  <path d="M216 226 Q252 224 266 178" fill="none" stroke="#bcd7f3" stroke-width="22" stroke-linecap="round"/>
  <path d="M216 226 Q252 224 266 178" fill="none" stroke="url(#shell)" stroke-width="16" stroke-linecap="round"/>
  <circle cx="268" cy="166" r="17" fill="url(#shell)" stroke="#bcd7f3" stroke-width="3"/>
</svg>
